[package]
name = "gxwi-principals-manager"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Beside this checkout until a libgxwi with the dialog role is released.
libgxwi = { path = "../gxwi/libgxwi" }
# SIDs, read and written. The revision libgxwi pins, which it must:
# `peios-sys` links libpeios, and a program can hold only one of it.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "02c87cb643c30eef6b74cd1d9d8b0ae067bed69a", package = "peios" }
# What the principals are, from authd's identity socket, and what changes
# them, on lpsd's admin socket: the protocols, and their clients. Beside
# this checkout until they are pushed.
libauthd = { path = "../authd/libauthd" }
libauthd-client = { path = "../authd/libauthd-client" }
# What this machine grants a principal, read and worked out by the code authd
# mints from, and written back to the registry.
libauthd-policy = { path = "../authd/libauthd-policy", features = ["write"] }
# The day a key was added, on this machine's clock.
jiff = "0.2.29"
